name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check failure_risk tests scripts
      - run: pytest -q

  pipeline-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/run_all.py
      - run: test -f artifacts/model_bundle.pkl
      - run: test -f artifacts/metrics.json

  docker-smoke:
    runs-on: ubuntu-latest
    needs: pipeline-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_all.py
      - run: docker build -t vehicle-failure-risk:${{ github.sha }} .
      - run: docker run -d --name risk-api -p 8000:8000 vehicle-failure-risk:${{ github.sha }}
      - run: |
          for i in {1..30}; do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs risk-api
          exit 1
