[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-failure-survival-risk"
version = "1.0.0"
description = "Production-oriented survival analysis platform for vehicle component failure risk"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["failure_risk*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
